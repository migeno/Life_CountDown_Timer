<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>のこり時間 — 寿命カウントダウン</title>

<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="のこり時間">
<style>
  :root{
    --bg:#0b1020;
    --bg2:#111936;
    --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.10);
    --fg:#eaf0ff;
    --muted:#8b97b8;
    --accent:#6ea8fe;
    --accent2:#7ee0c0;
    --warn:#ffb86b;
    --wi-text:#a9e9d5;   /* 「〜したら」の文 */
    --wi-num:#4fe3b0;    /* 「〜したら」の日数 */
    --radius:18px;
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{min-height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1100px 700px at 15% -10%, #1b2a5e 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 10%, #143b45 0%, transparent 55%),
      var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    font-feature-settings:"palt";
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; align-items:flex-start;
    /* iPhone のホームバーと重ならないように下端を確保 */
    padding-top:max(24px, env(safe-area-inset-top, 0px));
    padding-inline:16px;
  }
  /* 下端の余白は .wrap 側に持たせる
     （flex コンテナである body の padding-bottom は
       スクロール範囲に含まれず、ホームバーと重なってしまうため） */
  .wrap{
    width:100%;max-width:640px;
    padding-bottom:calc(56px + env(safe-area-inset-bottom, 0px));
  }
  .top{position:relative;display:flex;align-items:center;justify-content:center;
    min-height:40px;margin-bottom:18px}
  h1{font-size:15px;font-weight:600;letter-spacing:.14em;color:var(--muted);margin:0;text-align:center}
  /* 砂時計マークだけのボタン。見た目は素のアイコンだが、
     指で押せるよう 40px の当たり判定を確保している */
  .gear{
    position:absolute;right:-8px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;padding:0;
    border:0;background:none;color:var(--muted);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:color .15s;
  }
  .gear:hover{color:var(--fg)}
  .gear:active{opacity:.65}
  .hg{flex:none;width:22px;height:22px;fill:currentColor;transform-origin:50% 50%}
  .hg .sand{fill:#e8952e}
  /* 砂時計をひっくり返してから設定画面へ */
  @keyframes flip{ from{transform:rotate(0)} to{transform:rotate(180deg)} }
  .gear.spin .hg{animation:flip .62s cubic-bezier(.6,0,.35,1) forwards}
  @media (prefers-reduced-motion: reduce){
    .gear.spin .hg{animation:none}
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    backdrop-filter:blur(8px);
    margin-bottom:14px;
  }
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px;letter-spacing:.06em}
  .hint{display:block;color:rgba(139,151,184,.75);letter-spacing:0;margin-top:4px}
  .dob{display:flex;align-items:center;gap:6px}
  .dob .u{font-size:14px;color:var(--muted);flex:none}
  #y{flex:1.9}
  .dob.time{justify-content:flex-start}
  .dob.time select{flex:none;width:104px}
  select{
    flex:1;min-width:0;padding:13px 6px;font-size:17px;
    background:rgba(0,0,0,.28);color:var(--fg);
    border:1px solid var(--line);border-radius:12px;
    font-family:inherit;text-align:center;
    -webkit-appearance:none;appearance:none;
  }
  select:invalid{color:var(--muted)}
  select option{background:#141c34;color:var(--fg)}
  .err{font-size:12px;color:var(--warn);margin:10px 0 0;min-height:0}
  .seg{display:flex;gap:8px}
  .seg button{
    flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);
    background:rgba(0,0,0,.2);color:var(--muted);font-size:15px;font-family:inherit;
    cursor:pointer;transition:.15s;
  }
  .seg button[aria-pressed=true]{background:rgba(110,168,254,.18);border-color:rgba(110,168,254,.55);color:#fff}
  .field{margin-bottom:16px}
  .primary{
    width:100%;padding:15px;border:0;border-radius:12px;cursor:pointer;
    background:linear-gradient(120deg,var(--accent),#8b7bff);color:#08101f;
    font-size:16px;font-weight:700;font-family:inherit;letter-spacing:.05em;
  }
  .primary:disabled{opacity:.35;cursor:default}

  /* ---- main display ---- */
  .modes{display:flex;gap:8px;margin-bottom:14px}
  .modes button{
    flex:1;padding:11px 8px;border-radius:12px;border:1px solid var(--line);
    background:rgba(0,0,0,.2);color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;transition:.15s
  }
  .modes button[aria-pressed=true]{color:#fff;border-color:rgba(126,224,192,.5);background:rgba(126,224,192,.14)}

  .hero{text-align:center;padding:26px 18px 22px}
  .hero .cap{font-size:12px;color:var(--muted);letter-spacing:.16em;margin-bottom:14px}
  .days{
    font-size:clamp(56px,17vw,96px);font-weight:800;line-height:.95;
    font-variant-numeric:tabular-nums;letter-spacing:-.03em;
    background:linear-gradient(160deg,#fff,#9fc2ff 60%,#7ee0c0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .days small{font-size:.26em;font-weight:600;color:var(--muted);
    -webkit-text-fill-color:var(--muted);margin-left:8px;letter-spacing:.05em}
  .days small + .n{margin-left:13px}
  /* 年月日は桁数が増えるので少し小さく */
  .days.ymd{font-size:clamp(40px,12vw,68px)}
  .days.ymd small{font-size:.32em;margin-left:6px}
  .chev{
    background:none;border:0;padding:0 2px 0 12px;cursor:pointer;
    font-family:inherit;font-size:.30em;line-height:1;vertical-align:middle;
    color:var(--muted);-webkit-text-fill-color:var(--muted);
    -webkit-tap-highlight-color:transparent;transition:transform .15s,color .15s;
  }
  .chev:hover{color:var(--fg);-webkit-text-fill-color:var(--fg)}
  .chev:active{transform:translateX(3px)}
  .clock{margin-top:10px;font-size:22px;font-variant-numeric:tabular-nums;color:#cdd9f5;letter-spacing:.06em}
  .until{margin-top:14px;font-size:13px;color:var(--muted)}

  .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin:20px 0 8px}
  .bar>i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .barlabel{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
  .stat b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:3px}
  .stat span{font-size:11px;color:var(--muted);letter-spacing:.05em}

  h2{font-size:12px;color:var(--muted);letter-spacing:.14em;margin:0 0 13px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  tr:last-child td{border-bottom:0}
  td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;
    white-space:nowrap;padding-left:12px}
  .pill{display:inline-block;min-width:52px;text-align:right}

  /* 生活習慣の入力行 */
  .rows{border-top:1px solid rgba(255,255,255,.07)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .row>.k{font-size:14px;color:var(--fg);flex:none;
    display:flex;align-items:center;gap:9px}
  .ic{flex:none;width:19px;height:19px;color:var(--muted);
    fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .row select{flex:1;max-width:62%;text-align:left;padding:10px 12px;font-size:14px}
  .row .wh{display:flex;align-items:center;gap:6px}
  .row .wh input{width:64px;padding:10px 8px;font-size:15px;text-align:center;
    background:rgba(0,0,0,.28);color:var(--fg);border:1px solid var(--line);
    border-radius:10px;font-family:inherit;-webkit-appearance:none;appearance:none;margin:0}
  .row .wh span{font-size:12px;color:var(--muted)}
  .bmi{font-size:12px;color:var(--muted);text-align:right;margin:8px 0 0}
  .delta{font-weight:700}
  .plus{color:var(--accent2)}
  .minus{color:var(--warn)}
  /* 合計行は一段強く */
  tr.total td{
    border-top:1px solid rgba(255,255,255,.18);
    padding-top:13px;font-size:15px;color:var(--fg)
  }
  tr.total td:first-child{font-weight:700;letter-spacing:.02em}
  tr.total .delta{font-size:18px}
  .whatif{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
  .whatif p{margin:0 0 9px;font-size:14px;display:flex;justify-content:space-between;gap:10px;
    align-items:baseline}
  .whatif p>span:first-child{font-weight:600;color:var(--wi-text)}
  .whatif p .delta{flex:none;white-space:nowrap;font-size:16px;color:var(--wi-num)}
  .whatif p.wnote{display:block;font-size:11px;line-height:1.8;font-weight:400;
    color:var(--muted);margin-top:12px}
  .whatif p:last-child{margin-bottom:0}
  .note{font-size:11px;line-height:1.85;color:var(--muted)}
  .note a{color:#9fc2ff}
  .linkrow{display:flex;justify-content:center;gap:18px;margin-top:18px}
  .linkrow button{background:none;border:0;color:var(--muted);font-size:12px;font-family:inherit;
    cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px}
  .hidden{display:none}
  .hero .cap.over{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>LIFE COUNTDOWN</h1>
    <button type="button" id="edit" class="gear hidden" aria-label="設定" title="設定">
      <svg class="hg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.2 2.2h15.6l-1.8 2.4H6z"/>
        <path d="M6 19.4h12l1.8 2.4H4.2z"/>
        <path d="M6.8 4.6h10.4c0 3.1-3.4 5.2-5.2 7.4 1.8 2.2 5.2 4.3 5.2 7.4H6.8c0-3.1 3.4-5.2 5.2-7.4-1.8-2.2-5.2-4.3-5.2-7.4z"/>
        <path class="sand" d="M8.9 6.3h6.2c0 1.9-2.2 3.3-3.1 4.5-.9-1.2-3.1-2.6-3.1-4.5z"/>
        <path class="sand" d="M9.1 17.7c.8-1.7 2-2.7 2.9-2.7s2.1 1 2.9 2.7z"/>
      </svg></button>
  </header>

  <!-- ========== 設定 ========== -->
  <section id="setup" class="card">
    <div class="field">
      <label for="y">生年月日</label>
      <div class="dob">
        <select id="y" required></select><span class="u">年</span>
        <select id="m" required></select><span class="u">月</span>
        <select id="d" required></select><span class="u">日</span>
      </div>
      <p class="err" id="err"></p>
    </div>
    <div class="field">
      <label for="h">誕生時刻<span class="hint">わからなければ 12:00 のままで大丈夫です</span></label>
      <div class="dob time">
        <select id="h"></select><span class="u">時</span>
        <select id="mi"></select><span class="u">分</span>
      </div>
    </div>
    <div class="field">
      <label>性別（統計の選択に使用）</label>
      <div class="seg">
        <button type="button" data-sex="m" aria-pressed="false">男性</button>
        <button type="button" data-sex="f" aria-pressed="false">女性</button>
      </div>
    </div>
    <div class="field">
      <label>生活習慣<span class="hint">任意。未選択の項目は「日本人の平均」として扱います</span></label>
      <div class="rows">
        <div class="row">
          <span class="k"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="14.5" width="13" height="4.5" rx="1"/>
            <rect x="17.5" y="14.5" width="4" height="4.5" rx="1"/>
            <path d="M18.5 11.5c1.4-.9 1.4-2.6 0-3.5"/></svg>喫煙</span>
          <select id="smoke"></select>
        </div>
        <div class="row">
          <span class="k"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4.5" width="18" height="15" rx="3.5"/>
            <path d="M7.6 14.6a4.7 4.7 0 0 1 8.8 0"/>
            <path d="M12 14.6l3.1-2.8"/></svg>身長・体重</span>
          <span class="wh">
            <input type="number" id="ht" inputmode="numeric" min="100" max="230" placeholder="––"><span>cm</span>
            <input type="number" id="wt" inputmode="numeric" min="25" max="200" placeholder="––"><span>kg</span>
          </span>
        </div>
        <div class="row">
          <span class="k"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2" y="8.5" width="4.2" height="7" rx="1.4"/>
            <rect x="17.8" y="8.5" width="4.2" height="7" rx="1.4"/>
            <path d="M6.2 12h11.6"/></svg>運動習慣</span>
          <select id="move"></select>
        </div>
        <div class="row">
          <span class="k"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 3.5h11l-1 5.5a4.5 4.5 0 0 1-9 0z"/>
            <path d="M12 14v6M8.5 20.5h7"/></svg>飲酒</span>
          <select id="drink"></select>
        </div>
      </div>
      <p class="bmi" id="bmiOut"></p>
    </div>
    <button class="primary" id="start" disabled>カウントダウンを開始</button>
    <p class="note" style="margin:14px 0 0">入力した情報はこの端末のブラウザ内（localStorage）にのみ保存され、どこにも送信されません。</p>
    <div class="linkrow hidden" id="resetRow">
      <button type="button" id="reset">データを消去</button>
    </div>
  </section>

  <!-- ========== 表示 ========== -->
  <main id="main" class="hidden">
    <div class="modes">
      <button type="button" data-mode="life" aria-pressed="true">平均余命まで</button>
      <button type="button" data-mode="health" aria-pressed="false">健康寿命まで</button>
    </div>

    <section class="card hero">
      <div class="cap" id="cap">のこり</div>
      <div class="days" id="big">
        <span id="bigVal">–</span><button type="button" class="chev" id="unitToggle"
          aria-label="表示を切り替える" title="日数 ⇄ 年月日">›</button>
      </div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="until" id="until"></div>

      <div class="bar"><i id="bar" style="width:0"></i></div>
      <div class="barlabel"><span id="bl">0 歳</span><span id="br"></span></div>
    </section>

    <section class="card">
      <div class="grid">
        <div class="stat"><b id="age">–</b><span>いまの年齢</span></div>
        <div class="stat"><b id="lived">–</b><span>生きてきた日数</span></div>
        <div class="stat"><b id="weeks">–</b><span id="lw">のこり週数</span></div>
        <div class="stat"><b id="months">–</b><span id="lm">のこり月数</span></div>
      </div>
    </section>

    <section class="card">
      <h2>あなたの年齢での統計</h2>
      <table>
        <tr><td>平均余命（あと何年生きるか）</td><td><span id="s-ex"></span></td></tr>
        <tr><td>推定寿命（到達年齢）</td><td><span id="s-death"></span></td></tr>
        <tr><td>健康寿命の目安</td><td><span id="s-health"></span></td></tr>
        <tr><td>健康を損なってからの期間</td><td><span id="s-gap"></span></td></tr>
      </table>
    </section>

    <section class="card hidden" id="riskCard">
      <h2>生活習慣による補正</h2>
      <table id="riskTable"></table>
      <div class="whatif hidden" id="whatif"></div>
    </section>

    <section class="card">
      <h2>その年齢まで生きる確率</h2>
      <table id="surv"></table>
    </section>

    <section class="card">
      <p class="note" id="src"></p>
    </section>

  </main>
</div>

<script>
/* ===========================================================
   生命表データ：厚生労働省「令和6(2024)年簡易生命表」
   ex = 平均余命（年）, lx = 生存数（10万人あたり） 年齢 0–105
   =========================================================== */

  m: {

    lx:[100000,99818,99793,99776,99763,99753,99745,99736,99729,99721,99714,99706,99697,99687,99676,99662,99644,99622,99595,99565,99529,99488,99441,99393,99345,99298,99251,99205,99158,99111,99061,99009,98953,98895,98834,98769,98700,98625,98547,98463,98375,98279,98174,98060,97937,97806,97665,97512,97342,97154,96944,96713,96459,96180,95871,95531,95155,94739,94283,93782,93235,92640,91991,91281,90502,89644,88701,87672,86552,85335,84007,82559,80976,79250,77373,75338,73158,70838,68360,65698,62840,59785,56546,53152,49598,45872,41988,37980,33901,29807,25765,21855,18244,14917,11912,9258,6977,5076,3547,2367,1498,893,497,256,120,51]
  },
  f: {

/* 各項目の「日本人平均のハザード比」。生命表そのものが平均的な日本人を
   表しているので、これで割って基準を合わせる。全項目が平均どおりの人は
   補正なし（＝簡易生命表そのまま）になる。 */
function meanHR(key, sex){
  return RISK[key].opts.reduce((s, o) => s + o.p[sex] * o.hr[sex], 0);
}
function factorHR(key, sex, value){
  if (!value) return 1;                       // 未選択＝平均どおり
  const o = RISK[key].opts.find(o => o.v === value);
  return o ? o.hr[sex] / meanHR(key, sex) : 1;
}
function bmiBand(bmi){
  const o = [...RISK.bmi.opts].reverse().find(o => bmi >= o.lo);
  return o ? o.v : null;
}

const YEAR = 365.2425 * 86400000;      // 1年（ミリ秒）
const KEY      = 'lifeCountdown.v1';
const UNIT_KEY = 'lifeCountdown.unit';   // 日数 / 年月日 のどちらで見ていたか

/* --- 生命表の線形補間 --- */
function at(arr, age){
  if (age <= 0) return arr[0];
  if (age >= 105) return arr[105];
  const i = Math.floor(age), t = age - i;
  return arr[i] + (arr[i+1] - arr[i]) * t;
}

/* -----------------------------------------------------------
   ハザード比を反映した平均余命
   生存数 lx から年齢別死亡率 qx を復元し、qx に HR を掛けて
   生命表を組み直す。近似誤差を持ち込まないよう、HR=1 の場合との
   「差」だけを公式の平均余命に足している。
   ----------------------------------------------------------- */
function exModel(sex, a0, hr){
  const lx = LT[sex].lx;
  let l = 1, T = 0;
  for (let a = a0; a <= 105; a++){
    const q = a >= 105 ? 1
      : Math.min(1, (1 - lx[a+1] / lx[a]) * hr);
    const next = l * (1 - q);
    T += (l + next) / 2;                 // その年の定常人口
    l = next;
    if (l <= 0) break;
  }
  return T;                              // l(a0)=1 なので T がそのまま平均余命
}

/* いまの年齢から target 歳まで生きる確率（％、補正後） */
function survTo(sex, age, target, hr){
  const lx = LT[sex].lx;
  let s = 1;
  for (let a = Math.floor(age); a < Math.min(target, 105); a++){
    s *= 1 - Math.min(1, (1 - lx[a+1] / lx[a]) * hr);
  }
  return s * 100;
}

/* 補正後の平均余命（年齢は小数、HR=1 ならそのまま公式値） */
function exAt(sex, age, hr){
  const base = at(LT[sex].ex, age);
  if (Math.abs(hr - 1) < 1e-9) return base;
  const i = Math.min(104, Math.floor(age)), t = Math.min(1, age - i);
  const d0 = exModel(sex, i,     hr) - exModel(sex, i,     1);
  const d1 = exModel(sex, i + 1, hr) - exModel(sex, i + 1, 1);
  return Math.max(0.1, base + d0 + (d1 - d0) * t);
}

/* 2つの時刻の差を「◯年◯か月◯日＋端数」に分解する。
   月の長さが一定でないので、カレンダー上で数える。 */
function splitYMD(from, to){
  const a = new Date(Math.min(from, to)), b = new Date(Math.max(from, to));
  let y = b.getFullYear() - a.getFullYear();
  const probe = new Date(a);
  probe.setFullYear(a.getFullYear() + y);
  if (probe > b){ y--; probe.setFullYear(a.getFullYear() + y); }

  let m = 0;
  for (;;){
    const next = new Date(probe);
    next.setMonth(probe.getMonth() + m + 1);
    if (next > b) break;
    m++;
  }
  const start = new Date(probe);
  start.setMonth(probe.getMonth() + m);

  const rest = b - start;
  return { y, m, d: Math.floor(rest / 86400000), rem: rest % 86400000 };
}

function range(from, to, step){
  const a = [];
  for (let v = from; step > 0 ? v <= to : v >= to; v += step) a.push(v);
  return a;
}
function fill(sel, values, placeholder){
  sel.innerHTML = `<option value="" disabled selected>${placeholder}</option>` +

/* ===================== 推計 ===================== */
function begin(){
  const t   = LT[state.sex];
  // 旧バージョンの保存データには time が無いので、その場合は正午とみなす
  const bms = new Date(`${state.birth}T${state.time || DEFAULT_TIME}:00`).getTime();
  const age = (Date.now() - bms) / YEAR;          // 起動時点の年齢（小数）

  /* 生活習慣ごとのハザード比。BMI は身長・体重から判定する */
  const L = state.life || {};
  const bmi = (L.ht && L.wt) ? L.wt / (L.ht / 100) ** 2 : null;
  const picks = {
    smoke: L.smoke || null,
    bmi  : bmi ? bmiBand(bmi) : null,
    move : L.move  || null,
    drink: L.drink || null
  };
  const hrs = {};
  let hr = 1;
  FACTORS.forEach(k => { hrs[k] = factorHR(k, state.sex, picks[k]); hr *= hrs[k]; });

  const exBase    = at(t.ex, age);                // 補正なし（統計そのまま）
  const ex        = exAt(state.sex, age, hr);     // 補正後
  const deathAge  = age + ex;                     // 推定到達年齢
  const healthAge = deathAge - t.gap;             // 健康寿命の目安

  calc = {
    t, bms, age, ex, exBase, deathAge, healthAge, hr, hrs, picks, bmi,
    lifeEnd  : bms + deathAge  * YEAR,
    healthEnd: bms + healthAge * YEAR
  };

  $('#setup').classList.add('hidden');
  $('#main').classList.remove('hidden');
  $('#edit').classList.remove('hidden');
  renderStatic();
  tick();
  timer = setInterval(tick, 200);
}

    `健康寿命：厚生労働省 令和4(2022)年値（${t.label} ${t.healthy} 年）。` +
    `健康寿命の目安は「推定寿命 −（平均寿命 − 健康寿命 = ${t.gap} 年）」。<br>` +
    `生活習慣の補正は、生命表の年齢別死亡率に下記のハザード比を掛けて生命表を組み直す方法によります。` +
    `喫煙・運動・飲酒は<a href="https://epi.ncc.go.jp/jphc/" target="_blank" rel="noopener">国立がん研究センター 多目的コホート研究（JPHC）</a>、` +
    `BMIは日本人7コホートの統合解析（Sasazuki et al., J Epidemiol 2011）。<br>` +
    `各項目は日本人の該当割合で重みづけして基準を合わせてあり、すべて「答えない」なら簡易生命表そのままの値になります。` +
    `複数の項目は掛け合わせて計算しているため、当てはまる項目が多い人ほど差が大きく出やすい点に注意してください。<br>` +

/* ===================== 生活習慣の補正 ===================== */
function toDays(years){ return Math.round(years * 365.2425); }
function signed(d){
  const cls = d >= 0 ? 'plus' : 'minus';
  return `<span class="delta ${cls}">${d >= 0 ? '+' : '−'}${nf(Math.abs(d))} 日</span>`;
}

function renderRisk(){
  const c = calc, sex = state.sex;
  const answered = FACTORS.filter(k => c.picks[k]);
  if (!answered.length){ $('#riskCard').classList.add('hidden'); return; }
  $('#riskCard').classList.remove('hidden');

  /* 各項目の寄与＝その項目だけを「平均」に戻したときとの差 */
  const rows = answered.map(k => {
    const without = c.hr / c.hrs[k];
    const d = toDays(c.ex - exAt(sex, c.age, without));
    const opt = RISK[k].opts.find(o => o.v === c.picks[k]);
    const name = k === 'bmi' ? `${c.bmi.toFixed(1)}（${opt.t}）` : opt.t;
    return `<tr><td>${RISK[k].label}：${name}</td><td>${signed(d)}</td></tr>`;
  });
  rows.push(`<tr class="total"><td>合計（統計そのままとの差）</td><td>${
    signed(toDays(c.ex - c.exBase))}</td></tr>`);
  $('#riskTable').innerHTML = rows.join('');

  /* 「いま変えたらどうなるか」 */
  const wi = [];
  let bmiShown = false;
  FACTORS.forEach(k => {
    if (RISK[k].pick !== 'best' || !c.picks[k]) return;
    if (k === 'bmi'){
      const [lo, hi] = RISK.bmi.zone[sex];
      if (c.bmi >= lo && c.bmi < hi) return;   // すでに適正の範囲
    }
    const best = RISK[k].opts.reduce((a, b) => b.hr[sex] < a.hr[sex] ? b : a);
    if (best.v === c.picks[k]) return;
    const alt = c.hr / c.hrs[k] * (best.hr[sex] / meanHR(k, sex));
    const d = toDays(exAt(sex, c.age, alt) - c.ex);
    if (d <= 0) return;
    const verb = k === 'smoke' ? 'いま禁煙したら！'
               : k === 'move'  ? '運動習慣をつけたら！'
               : k === 'drink' ? '飲酒を週1回程度に減らしたら！'
               : `適正体重（BMI ${best.t}）に近づけたら！`;
    wi.push(`<p><span>${verb}</span>${signed(d)}</p>`);
    if (k === 'bmi') bmiShown = true;
  });
  if (bmiShown){
    wi.push(`<p class="wnote">※BMIの行だけは、体重を変えた効果ではなく` +
      `「その値の人たちとの比較」です。この統計で最も死亡率が低い帯を挙げていますが、` +
      `体重を動かして同じ差が得られるとは限りません。</p>`);
  }
  $('#whatif').innerHTML = wi.join('');
  $('#whatif').classList.toggle('hidden', !wi.length);
}

/* ===================== 毎秒の更新 ===================== */
function tick(){
  const c = calc, now = Date.now();
  const target = mode === 'life' ? c.lifeEnd : c.healthEnd;
  let rest = target - now;
  const over = rest < 0;
  if (over) rest = -rest;

  const days = Math.floor(rest / 86400000);
  const rem  = rest % 86400000;
  const hh   = String(Math.floor(rem / 3600000)).padStart(2,'0');
  const mm   = String(Math.floor(rem % 3600000 / 60000)).padStart(2,'0');
  const ss   = String(Math.floor(rem % 60000 / 1000)).padStart(2,'0');

  $('#cap').textContent   = mode === 'life'
    ? (over ? '平均余命を超えて生きています' : '平均余命まで、のこり')
    : (over ? '健康寿命の目安を超えています'   : '健康寿命まで、のこり');
  $('#cap').className     = 'cap' + (over ? ' over' : '');
  $('#clock').textContent = `${hh}:${mm}:${ss}`;

  if (unit === 'ymd'){
    const p = splitYMD(now, target);
    const part = (v, u) => v ? `<span class="n">${nf(v)}</span><small>${u}</small>` : '';
    // 年・月が0でも、日だけは必ず出す
    $('#bigVal').innerHTML = (part(p.y,'年') + part(p.m,'か月') + part(p.d,'日'))
      || `<span class="n">0</span><small>日</small>`;
  } else {
    $('#bigVal').innerHTML = `<span class="n">${nf(days)}</span><small>日</small>`;
  }
  $('#big').classList.toggle('ymd', unit === 'ymd');

  const d = new Date(target);
  $('#until').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日ごろ ＝ ` +
    `${(mode === 'life' ? c.deathAge : c.healthAge).toFixed(1)} 歳`;

  // 進捗バー（誕生 → 推定寿命）
  const ageNow = (now - c.bms) / YEAR;
  const pct = Math.min(100, Math.max(0, ageNow / c.deathAge * 100));
  $('#bar').style.width = pct.toFixed(3) + '%';
  $('#bl').textContent  = `0 歳 — 人生の ${pct.toFixed(2)}% を通過`;
  $('#br').textContent  = `${c.deathAge.toFixed(1)} 歳`;

  // 各種カウンター
  const lived = Math.floor((now - c.bms) / 86400000);
  $('#age').textContent    = Math.floor(ageNow) + ' 歳';
  $('#lived').textContent  = nf(lived) + ' 日';
  $('#weeks').textContent  = nf(Math.floor(days / 7)) + ' 週';
  $('#months').textContent = nf(Math.floor(rest / (YEAR/12))) + ' か月';
  $('#lw').textContent     = over ? '超えてからの週数' : 'のこり週数';
  $('#lm').textContent     = over ? '超えてからの月数' : 'のこり月数';
}

/* ===================== 起動 ===================== */
(function init(){
  syncResetRow();
  const saved = localStorage.getItem(KEY);
  if (saved){
    try {
      state = JSON.parse(saved);
      if (state && state.birth && LT[state.sex]) return begin();
    } catch(e){ /* 壊れていれば設定画面へ */ }
  }
  state = null;
})();
</script>
